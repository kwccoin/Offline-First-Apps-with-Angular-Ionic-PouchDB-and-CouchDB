<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UK Stay Tracker</title>
    
    <!-- Clean, verified PouchDB script source -->
        <!-- Clean, verified PouchDB script source 2 -->
        <!-- script src="https://cloudflare.com" script -->
    <script src="pouchdb.min.js"></script>
    
    <style>
        :root {
            --primary-color: #00247D;
            --accent-color: #CF142B;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 10px;
        }

        h1 {
            color: var(--primary-color);
            font-size: 1.5rem;
        }

        .stats-box {
            background: linear-gradient(135deg, var(--primary-color), #0033aa);
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
        }

        .stats-box span {
            display: block;
            font-size: 2.5rem;
            font-weight: bold;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-weight: 600;
            font-size: 0.9rem;
        }

        input[type="date"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            width: 100%;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .log-section h2 {
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: #555;
        }

        .trip-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .trip-item {
            background: #f9f9f9;
            padding: 12px;
            border-radius: 6px;
            border-left: 4px solid var(--primary-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .trip-details div {
            font-size: 0.85rem;
            color: #666;
        }

        .trip-nights {
            font-weight: bold;
            color: var(--primary-color);
        }

        .delete-btn {
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>UK Stay Tracker</h1>
        </header>

        <div class="stats-box">
            <span id="total-nights">0</span>
            Total Nights in the UK
        </div>

        <form id="stay-form">
            <div class="form-group">
                <label for="arrival-date">Arrival Date</label>
                <input type="date" id="arrival-date" required>
            </div>
            <div class="form-group">
                <label for="departure-date">Departure Date</label>
                <input type="date" id="departure-date" required>
            </div>
            <button type="submit">Log Stay</button>
        </form>

        <div class="log-section">
            <h2>History</h2>
            <ul id="trip-list" class="trip-list"></ul>
        </div>
    </div>

    <script>
        // Initialize local PouchDB instance
        const db = new PouchDB('uk_stay_tracker');

        const stayForm = document.getElementById('stay-form');
        const arrivalInput = document.getElementById('arrival-date');
        const departureInput = document.getElementById('departure-date');
        const tripListEle = document.getElementById('trip-list');
        const totalNightsEle = document.getElementById('total-nights');

        stayForm.addEventListener('submit', function(e) {
            e.preventDefault();

            const arrivalDate = arrivalInput.value;
            const departureDate = departureInput.value;

            if (new Date(departureDate) <= new Date(arrivalDate)) {
                alert("Departure date must be after the arrival date.");
                return;
            }

            const nights = calculateNights(arrivalDate, departureDate);

            const doc = {
                _id: new Date().toISOString(),
                arrival: arrivalDate,
                departure: departureDate,
                nights: nights
            };

            db.put(doc).then(function () {
                stayForm.reset();
                fetchAndRenderTrips();
            }).catch(function (err) {
                console.error("Error saving data:", err);
            });
        });

        function calculateNights(arrival, departure) {
            const date1 = new Date(arrival + "T00:00:00");
            const date2 = new Date(departure + "T00:00:00");
            const diffTime = Math.abs(date2 - date1);
            return Math.round(diffTime / (1000 * 60 * 60 * 24));
        }

        function fetchAndRenderTrips() {
            db.allDocs({ include_docs: true, descending: true }).then(function (result) {
                let totalNights = 0;
                tripListEle.innerHTML = '';

                result.rows.forEach(function (row) {
                    const trip = row.doc;
                    totalNights += trip.nights;

                    const li = document.createElement('li');
                    li.className = 'trip-item';
                    li.innerHTML = `
                        <div class="trip-details">
                            <div class="trip-nights">${trip.nights} Night${trip.nights > 1 ? 's' : ''}</div>
                            <div>Arrived: ${trip.arrival}</div>
                            <div>Left: ${trip.departure}</div>
                        </div>
                        <button class="delete-btn" onclick="deleteTrip('${trip._id}', '${trip._rev}')">&times;</button>
                    `;
                    tripListEle.appendChild(li);
                });

                totalNightsEle.textContent = totalNights;
            }).catch(function (err) {
                console.error("Error fetching data:", err);
            });
        }

        window.deleteTrip = function(id, rev) {
            if (confirm("Delete this log?")) {
                db.remove(id, rev).then(function () {
                    fetchAndRenderTrips();
                });
            }
        };

        // Render any stored local items immediately upon initialization
        fetchAndRenderTrips();
    </script>
</body>
</html>
