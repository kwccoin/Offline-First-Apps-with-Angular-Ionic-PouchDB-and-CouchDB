<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Load the local database engine file directly from memory -->
    <script src="pouchdb.min.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UK Stay Tracker</title>
    <style>
        :root {
            --primary-color: #00247D;
            --accent-color: #CF142B;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 10px;
        }

        h1 {
            color: var(--primary-color);
            font-size: 1.5rem;
        }

        .stats-box {
            background: linear-gradient(135deg, var(--primary-color), #0033aa);
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
        }

        .stats-box span {
            display: block;
            font-size: 2.5rem;
            font-weight: bold;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-weight: 600;
            font-size: 0.9rem;
        }

        input[type="date"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            width: 100%;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #b00f22;
        }

        .log-section h2 {
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: #555;
        }

        .trip-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .trip-item {
            background: #f9f9f9;
            padding: 12px;
            border-radius: 6px;
            border-left: 4px solid var(--primary-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .trip-details div {
            font-size: 0.85rem;
            color: #666;
        }

        .trip-nights {
            font-weight: bold;
            color: var(--primary-color);
        }

        .delete-btn {
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 0 5px;
        }

        .delete-btn:hover {
            color: var(--accent-color);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>UK Stay Tracker Sort H5a</h1>
        </header>

        <div class="stats-box">
            <span id="total-nights">0</span>
            Total Nights in the UK

        <!-- Visual Visa Limit Alert Status Banner Container -->

                    <select id="active-person" style="padding: 8px; border-radius: 6px; border: 1px solid #ccc; font-size: 0.9rem; background: #fff; width: 100%;"></select>
                </div>
                <!-- Add New Name Trigger -->
                <button type="button" id="add-person-btn" style="background: var(--primary-color); padding: 8px 12px; margin-top: 20px; border-radius: 6px; color: #fff; font-size: 0.85rem; border: none; font-weight: bold; cursor: pointer;">+ New User</button>
            </div>

            <!-- Active UK Tax Year Selection Strip -->
            <div style="display: flex; flex-direction: column; gap: 4px;">
                <label for="active-tax-year" style="font-weight: 600; font-size: 0.85rem; color: #555;">Calculation Window (6 Apr – 5 Apr)</label>
                <select id="active-tax-year" style="padding: 8px; border-radius: 6px; border: 1px solid #ccc; font-size: 0.9rem; background: #fff; width: 100%;"></select>
            </div>

            <!-- Toggle Configurations Drawer Link -->
            <a href="#" id="toggle-settings-link" style="font-size: 0.8rem; color: var(--primary-color); text-decoration: underline; font-weight: 600; text-align: right; margin-top: 4px;">Show Server Configurations</a>
            
            <!-- Hidden Server IP Properties Drawer -->
            <div id="settings-drawer" style="display: none; background: #eee; padding: 12px; border-radius: 8px; border: 1px solid #ddd; flex-direction: column; gap: 10px; margin-top: 5px;">
                <div style="display: flex; flex-direction: column; gap: 4px;">
                    <label for="config-server-ip" style="font-weight: 600; font-size: 0.8rem; color: #444;">Target Server IP Address</label>
                    <input type="text" id="config-server-ip" placeholder="e.g., 192.168.1.246" style="padding: 8px; border-radius: 6px; border: 1px solid #ccc; font-size: 0.9rem;">
                </div>
                <button type="button" id="save-config-btn" style="background: var(--success-color); padding: 8px; border-radius: 6px; color: white; border: none; font-size: 0.85rem; font-weight: bold;">Save & Apply Settings</button>
            </div>
        </div>


        <form id="stay-form">
            <div class="form-group">
                <label for="arrival-date">Arrival Date</label>
                <input type="date" id="arrival-date" required>
            </div>
            <div class="form-group">
                <label for="departure-date">Departure Date</label>
                <input type="date" id="departure-date" required>
            </div>
            <div class="form-group" style="display: flex; flex-direction: column; gap: 5px;">
                <label for="trip-remark" style="font-weight: 600; font-size: 0.9rem;">Remark / Note</label>
                <input type="text" id="trip-remark" placeholder="e.g., London Vacation, Border Control Check" style="padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; width: 100%;">
            </div>

            <button type="submit">Log Stay</button>
        </form>

        <div class="log-section">
            <div class="log-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 5px; border-bottom: 1px solid #ddd;">
            <h2 style="font-size: 1.1rem; color: #555;">History</h2>
            <button type="button" id="sort-toggle-btn" style="background-color: transparent; color: #00247D; border: 1px solid #00247D; padding: 5px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; display: flex; align-items: center; gap: 6px; cursor: pointer;">
             Arrival <span id="sort-direction-icon">↓</span>
    </button>
</div>
            <ul id="trip-list" class="trip-list"></ul>
        </div>
    </div>

    <script>
        /**
         * ENGINE EMULATOR FOR COUCHDB/POUCHDB COMBINATION
         * Mimics identical PouchDB API signatures locally to guarantee execution 
         * without external package dependency or SSL constraints.
         */
        class LocalPouchEmulator {
            constructor(dbName) {
                this.storageKey = `pouch_${dbName}`;
                if (!localStorage.getItem(this.storageKey)) {
                    localStorage.setItem(this.storageKey, JSON.stringify([]));
                }
            }

            put(doc) {
                return new Promise((resolve) => {
                    const data = JSON.parse(localStorage.getItem(this.storageKey));
                    doc._rev = 'rev_' + Math.random().toString(36).substring(2, 9);
                    data.push(doc);
                    localStorage.setItem(this.storageKey, JSON.stringify(data));
                    resolve({ ok: true, id: doc._id, rev: doc._rev });
                });
            }

            allDocs(options) {
                return new Promise((resolve) => {
                    let data = JSON.parse(localStorage.getItem(this.storageKey));
                    if (options.descending) {
                        data.reverse();
                    }
                    const rows = data.map(item => ({ doc: item, id: item._id, value: { rev: item._rev } }));
                    resolve({ total_rows: rows.length, offset: 0, rows: rows });
                });
            }

            remove(id, rev) {
                return new Promise((resolve) => {
                    let data = JSON.parse(localStorage.getItem(this.storageKey));
                    data = data.filter(item => item._id !== id);
                    localStorage.setItem(this.storageKey, JSON.stringify(data));
                    resolve({ ok: true, id: id, rev: rev });
                });
            }
        }

        // --- 2. GLOBAL DATABASE ENGINE STATE HANDLES ---

        // --- 3. MULTI-PLATFORM NETWORK TRANSPARENCY DETECTOR ---

        // --- 4. THE DYNAMIC DATABASE FACTORY ENGINE (MUST BE DEFINED HERE) ---

                // --- THE DYNAMIC DATABASE FACTORY ENGINE (SAFETY-LOCKED) ---

            const databaseName = "uk_stay_tracker_" + cleanDbSlug;

            // 3. INSTANTIATE COMPLETELY ISOLATED WORKSPACES
            db = new PouchDB(databaseName);
            remoteDB = new PouchDB('http://admin:Cdb3579%21@' + targetServerIP + ':5984/' + databaseName);

            // 4. LAUNCH SANITIZED REPLICATION CHANNEL
            syncHandler = db.sync(remoteDB, { live: true, retry: true })
                .on('change', function () {

        // --- 5. INITIAL ENGINE BOOTSTRAP ---
        // Instantly invoke the engine so variables 'db' and 'remoteDB' are populated
        initializeDatabaseForProfile(defaultPerson);

        // --- 6. CORE USER PROFILES MANIFEST CONFIG ---
        function syncUserProfileList() {
            const configId = "_local/shared_profile_manifest";
            db.get(configId).then(function(doc) {
                console.log("✈ Found shared user profiles document:", doc.names);
                savedPeople = doc.names;
                populatePeopleDropdown();
                fetchAndRenderTrips();
            }).catch(function(err) {
                if (err.status === 404) {
                    console.log("line 352 - 404");
                    const initialConfigDoc = { _id: configId, names: ["Dennis", "Sarah"] };

        // Save layout state back to storage if initializing for the first time
        if(!localStorage.getItem('tracker_people')) {
            localStorage.setItem('tracker_people', JSON.stringify(savedPeople));
        }

        // --- 2. MULTI-PLATFORM NETWORK TRANSPARENCY BRIDGE ---
        let activeIP = savedServerIP;
        if (navigator.userAgent.toLowerCase().includes("android")) {
            if (/emulator|google_sdk|generic|vbox/i.test(navigator.userAgent)) {
                activeIP = "10.0.2.2";
            }
        }

        // Initialize our data layer engine
        // const db = new LocalPouchEmulator('uk_stay_tracker');

        // Initialize local PouchDB browser database
        // 1. Initialize your local on-device database container

        // error as new let db = null const

        // 2. UNIVERSAL NETWORK TRANSPARENCY DETECTOR

        // const 
        remoteDB = new PouchDB('http://admin:Cdb3579%21@' + targetServerIP + ':5984/uk_stay_tracker');


        // ==========================================

        // ==========================================
        db.sync(remoteDB, {
            live: true,
            retry: true
        }).on('change', function (info) {

            fetchAndRenderTrips();
        }).on('paused', function (err) {

        }).on('active', function () {

        }).on('denied', function (err) {
            console.error("❌ SYNC DENIED: CouchDB credentials rejected!", err);
        }).on('error', function (err) {
            console.error("🚨 CRITICAL SYNC ERROR:", err);
        });

        // Refresh the profile list across devices automatically
        syncUserProfileList();

        const stayForm = document.getElementById('stay-form');
        const arrivalInput = document.getElementById('arrival-date');
        const departureInput = document.getElementById('departure-date');
        const remarkInput = document.getElementById('trip-remark');
        const tripListEle = document.getElementById('trip-list');
        const totalNightsEle = document.getElementById('total-nights');

        const personSelect = document.getElementById('active-person');
        const taxYearSelect = document.getElementById('active-tax-year');
        const addPersonBtn = document.getElementById('add-person-btn');
        const toggleSettingsLink = document.getElementById('toggle-settings-link');
        const settingsDrawer = document.getElementById('settings-drawer');
        const configServerIP = document.getElementById('config-server-ip');
        const saveConfigBtn = document.getElementById('save-config-btn');

        // Sorting State Management Tracking Flags
        // see below

        // 4. MEMORY STATE MANAGERS
        // see above

        // 4d1. Sorting State Management Variables
        let isSortDescending = true; 
        const sortToggleBtn = document.getElementById('sort-toggle-btn');
        const sortDirectionIcon = document.getElementById('sort-direction-icon');

        if(!localStorage.getItem('tracker_people')) {
            localStorage.setItem('tracker_people', JSON.stringify(savedPeople));
        }

        // 5. FIXED: Android Calendar Grey-Out Enforcement Engine
        // Changing this back from 'change' to 'input' forces Android to lock calendar choices instantly!
        arrivalInput.addEventListener('input', function() {
            if (arrivalInput.value) {
                departureInput.value = arrivalInput.value;
                departureInput.setAttribute('min', arrivalInput.value);
                departureInput.min = arrivalInput.value;
            }
        });



        // 6. POPULATE CONTROLLERS
        function populatePeopleDropdown() {
            personSelect.innerHTML = '';
            savedPeople.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p;
                opt.textContent = p;
                if(p === defaultPerson) opt.selected = true;
                personSelect.appendChild(opt);
            });
        }

        // Generate UK Tax Year spans from 2020/21 up to 2027/28 automatically
        function populateTaxYearsDropdown() {
            taxYearSelect.innerHTML = '';
            // Pre-seed any comprehensive view fallback options
            const allOpt = document.createElement('option');
            allOpt.value = "ALL";
            allOpt.textContent = "All Historic Records (Lifetime Total)";
            taxYearSelect.appendChild(allOpt);

            for (let y = 2027; y >= 2020; y--) {
                const opt = document.createElement('option');
                const nextYearShort = (y + 1).toString().substring(2);
                opt.value = y.toString();
                opt.textContent = "UK Tax Year: " + y + " / " + nextYearShort;
                // Default calculation window highlight target to current timeline
                if (y === 2026) opt.selected = true; 
                taxYearSelect.appendChild(opt);
            }

        populatePeopleDropdown();
        populateTaxYearsDropdown();

        // 7. COMPONENT INTERACTION CONTROLLERS

            defaultPerson = personSelect.value;
            localStorage.setItem('tracker_active_person', defaultPerson);
            fetchAndRenderTrips();
        });

        taxYearSelect.addEventListener('change', function() { fetchAndRenderTrips(); });

        configServerIP.value = savedServerIP;


        // Toggle Settings Display Link
        toggleSettingsLink.addEventListener('click', function(e) {
            e.preventDefault();
            if(settingsDrawer.style.display === "none") {

                toggleSettingsLink.textContent = "Hide Server Configurations";
            } else {
                settingsDrawer.style.display = "none";
                toggleSettingsLink.textContent = "Show Server Configurations";
            }
        });

        // Save Configuration Server IP Engine

            if(!freshIP) return alert("Please supply a valid network target string.");
            localStorage.setItem('tracker_server_ip', freshIP);
            alert("Network configuration saved! Relaunch the app container to connect to coordinates: " + freshIP);
            location.reload();
        });

        // Add New Person Profile Controller
        addPersonBtn.addEventListener('click', function() {
            const rawName = prompt("Enter traveller profile name:");
            if(!rawName) return;
            
            // Format name to standard capitalization
            const cleanName = rawName.trim().charAt(0).toUpperCase() + rawName.trim().slice(1).toLowerCase();
            
            if(cleanName && !savedPeople.includes(cleanName)) {
                savedPeople.push(cleanName);
                
                // Track default user switch locally
                defaultPerson = cleanName;
                localStorage.setItem('tracker_active_person', defaultPerson);

                // Update the network database profile document
                const configId = "_local/shared_profile_manifest";
                db.get(configId).then(function(doc) {
                    doc.names = savedPeople;
                    return db.put(doc);
                }).then(function() {
                    console.log("🚀 Shared user list successfully updated across database mesh!");

                    initializeDatabaseForProfile(defaultPerson);
                    fetchAndRenderTrips();

                    initializeDatabaseForProfile(defaultPerson);

        // 5d1 Automatically align the departure date picker when an arrival date is chosen

            if (arrivalInput.value) {

                // Force Android Webview to visually repaint the selection layout constraints
                departureInput.blur();

        });

        // Continuous verification guard for Apple's date wheel container
        departureInput.addEventListener('change', function() {
            if (arrivalInput.value && departureInput.value) {
                if (new Date(departureInput.value) <= new Date(arrivalInput.value)) {
                    // Reset the box back to safety instantly
                    departureInput.value = arrivalInput.value;
                }
            }
        });


        stayForm.addEventListener('submit', function(e) {
            e.preventDefault();

            const arrivalDate = arrivalInput.value;
            const departureDate = departureInput.value;

            if (!arrivalDate || !departureDate) return;

            if (new Date(departureDate) <= new Date(arrivalDate)) {
                alert("Departure date must be after the arrival date.");
                return;
            }

            // 2. FETCH THE LIVE PROFILE NAME AT THE EXACT MILLISECOND OF SUBMISSION
            const activeProfileDropdown = document.getElementById('active-person');
            const lockedProfileName = activeProfileDropdown ? activeProfileDropdown.value : "Dennis";

            const doc = {
                _id: 'trip_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7),
                arrival: arrivalDate,

                // permanently stopping data from leaking into other traveler profiles.
                person: lockedProfileName 
            };

            console.log("Saving document to PouchDB container layout:", doc);


            // Save, then refresh the history list first, and reset the form layout LAST
            db.put(doc).then(function () {
                console.log("Document created successfully inside local PouchDB container!");

                arrivalInput.value = '';
                departureInput.value = '';
                if (remarkInput) remarkInput.value = ''; // Clears the note box for your next entry
                if (departureInput.removeAttribute) departureInput.removeAttribute('min'); 

                fetchAndRenderTrips();
            }).catch(function (err) {
                // This alert will pop up on your Mac screen and tell us EXACTLY why it failed!
                alert("Database insertion rejected: " + err.message + " (" + err.status + ")");
                console.error("Local save error context:", err);
            });

        });


        function calculateNights(arrival, departure) {
            const date1 = new Date(arrival + "T00:00:00");
            const date2 = new Date(departure + "T00:00:00");
            const diffTime = Math.abs(date2 - date1);
            return Math.round(diffTime / (1000 * 60 * 60 * 24));
        }

        // 1. Calculate matching nights strictly bound to a target UK Tax Year window
        function calculateTaxYearNights(arrivalStr, departureStr, targetStartYear) {
            const tripArrival = new Date(arrivalStr + "T00:00:00");
            const tripDeparture = new Date(departureStr + "T00:00:00");
            
            // Establish absolute boundaries for the chosen UK Tax Year profile
            const taxYearStart = new Date(targetStartYear, 3, 6); // 6 April
            const taxYearEnd = new Date(parseInt(targetStartYear) + 1, 3, 5); // 5 April
            
            // Evaluate if the logged trip falls completely outside the active calculation window
            if (tripDeparture < taxYearStart || tripArrival > taxYearEnd) {
                return 0; // Contributes zero nights to this specific calculation loop
            }
            
            // Intelligently clip dates if the trip physically straddles a boundary line
            const calculationArrival = tripArrival < taxYearStart ? taxYearStart : tripArrival;
            const calculationDeparture = tripDeparture > taxYearEnd ? taxYearEnd : tripDeparture;
            
            const diffTime = Math.abs(calculationDeparture - calculationArrival);
            return Math.round(diffTime / (1000 * 60 * 60 * 24));
        }


                // Visual Visa Limit Alert Status Banner Engine
        // Visual Visa Limit Alert Status Banner Engine (Direct Inline Layout Styling)
        function updateVisaVisualBanner(totalNights) {
            const statusBanner = document.getElementById('status-banner');
            if (!statusBanner) return; // Safety exit if element isn't found
            
            if (totalNights === 0) {
                statusBanner.style.display = "none";
            } else if (totalNights < 70) {
                // STATUS SAFE: Apply green design layouts directly to the element properties
                statusBanner.style.display = "block";
                statusBanner.style.backgroundColor = "#e8f5e9";
                statusBanner.style.color = "#2e7d32";
                statusBanner.textContent = "✔ Visa/Tax Status Safe";
            } else if (totalNights >= 70 && totalNights < 90) {
                // STATUS WARNING: Apply orange amber alert formatting attributes
                statusBanner.style.display = "block";
                statusBanner.style.backgroundColor = "#fff3e0";
                statusBanner.style.color = "#f57c00";
                statusBanner.textContent = "⚠ Warning: 70+D Approaching 90D";
            } else if (totalNights >= 90 && totalNights < 120) {
                // STATUS WARNING: Apply orange amber alert formatting attributes
                statusBanner.style.display = "block";
                statusBanner.style.backgroundColor = "#fff3e0";
                statusBanner.style.color = "#f57c00";
                statusBanner.textContent = "🚨 Warning: 90+D Approaching 120D";
            } else if (totalNights >= 120 && totalNights < 180) {
                // STATUS WARNING: Apply orange amber alert formatting attributes
                statusBanner.style.display = "block";
                statusBanner.style.backgroundColor = "#fff3e0";
                statusBanner.style.color = "#f57c00";
                statusBanner.textContent = "🚨 Warning: 120+D Approaching 180D";
            } else {
                // STATUS DANGER: Apply strict red threshold restriction warnings
                statusBanner.style.display = "block";
                statusBanner.style.backgroundColor = "#ffebee";
                statusBanner.style.color = "#c62828";
                statusBanner.textContent = "🚨 Alert: 180D Visa/Tax Exceeded!";
            }
        }




        function fetchAndRenderTrips() {
            // 1. Remove descending:true here so the emulator returns a clean, raw array list
            db.allDocs({ include_docs: true }).then(function (result) {
                let totalNights = 0;
                tripListEle.innerHTML = '';

                if (result.rows.length === 0) {
                    tripListEle.innerHTML = '<div class="empty-state">No stays logged yet. Tap above to track your first trip.</div>';
                    totalNightsEle.textContent = '0';
                    updateVisaVisualBanner(0);
                    return;
                }

                const trips = result.rows.map(row => row.doc);

                // Extract and filter matching profile footprints
                // Handles fallback defaults: if an older record has no person metadata token, it maps it to Dennis automatically
                // const targetUser = personSelect.value;
                // const chosenTaxYear = taxYearSelect.value;

                const currentSelection = document.getElementById('active-person').value;
                const chosenTaxYear = document.getElementById('active-tax-year').value;

                const targetUser = currentSelection; // Bridge alias maps the old reference strings cleanly
                
                const rawTrips = result.rows.map(row => row.doc);
                const userTrips = rawTrips.filter(t => {
                    if (currentSelection === "ALL") {
                        return true; // Bypass the lock to show everyone's logs on the master panel
                    }
                    
                    // Fallback configuration check: treat legacy records as "Dennis" if key token is missing
                    
                    const recordOwner = t.person || "Dennis";
                    return recordOwner === currentSelection;
                });

                if (userTrips.length === 0) {
                    tripListEle.innerHTML = '<div class="empty-state">No stays logged for ' + targetUser + ' yet.</div>';
                    totalNightsEle.textContent = '0';
                    updateVisaVisualBanner(0);
                    return;
                }

                // 2. SORTING LOGIC: Sort entries explicitly by Arrival Date (Latest first)
                // trips.sort((a, b) => new Date(b.arrival) - new Date(a.arrival));
                // 4d3r trips.sort((a, b) => new Date(a.arrival) - new Date(b.arrival));
                // 4d3  Evaluate user preference order on demand
                if (isSortDescending) {
                    trips.sort((a, b) => new Date(b.arrival) - new Date(a.arrival)); // Latest First
                } else {
                    trips.sort((a, b) => new Date(a.arrival) - new Date(b.arrival)); // Oldest First
                }

                trips.forEach(function (trip) {
                    //totalNights += trip.nights;
                    let calculatedNightsDisplay = trip.nights;
                    
                    // --- THE UK TAX YEAR ALLOCATION MATHEMATICS ---
                    // Clip math calculation rules if looking at a specific window boundary block
                    if (chosenTaxYear !== "ALL") {
                        const startYear = parseInt(chosenTaxYear);
                        const taxStartBoundary = new Date(startYear, 3, 6); // 6th April
                        const taxEndBoundary = new Date(startYear + 1, 3, 5); // 5th April
                        
                        const tripArr = new Date(trip.arrival + "T00:00:00");
                        const tripDep = new Date(trip.departure + "T00:00:00");
                        
                        // Check if trip falls completely outside the selected boundary target
                        if (tripDep < taxStartBoundary || tripArr > taxEndBoundary) {
                            calculatedNightsDisplay = 0; 
                        } else {
                            // Clip timeline overlapping dates to display accurate calculations within the window span
                            const activeArrival = tripArr < taxStartBoundary ? taxStartBoundary : tripArr;
                            const activeDeparture = tripDep > taxEndBoundary ? taxEndBoundary : tripDep;
                            const mathDiff = Math.abs(activeDeparture - activeArrival);
                            calculatedNightsDisplay = Math.round(mathDiff / (1000 * 60 * 60 * 24));
                        }
                    }

                    totalNightsEle.textContent = parseInt(totalNightsEle.textContent || 0) + calculatedNightsDisplay;
                    totalNights += calculatedNightsDisplay;



                    // Safe string concatenation to handle the optional text remark note gracefully
                    let remarkHtml = '';
                    if (trip.remark) {
                        remarkHtml = '<div class="trip-note" style="margin-top: 4px; font-style: italic; color: #555; font-size: 0.8rem;">Note: ' +
                             trip.remark + '</div>';
                    }

                    // Append context details flag showing calculated window distribution impact
                    let boundaryInfoHtml = '';
                    if (chosenTaxYear !== "ALL" && calculatedNightsDisplay !== trip.nights && calculatedNightsDisplay > 0) {
                        boundaryInfoHtml = '<div style="color: var(--warning-color); font-size: 0.75rem; font-weight: 600;">⚠️ Truncated to Tax Year: (' +
                             calculatedNightsDisplay +
                              ' of ' +
                               trip.nights +
                                ' nights)</div>';
                    }

                    const li = document.createElement('li');
                    li.className = 'trip-item';
                    li.innerHTML = [
                        '<div class="trip-details">',
                            '<div class="trip-nights">' + trip.nights + ' Night' +
                                 (trip.nights > 1 ? 's' : '') + 
                                 (currentSelection === "ALL" ? ' <span style="font-size:0.75rem; color:#666; font-weight:normal;">(' +
                                 (trip.person || "Dennis") + ')</span>' : '') +
                                 '</div>',
                            '<div>Arrived: ' + formatDate(trip.arrival) + '</div>',
                            '<div>Left: ' + formatDate(trip.departure) + '</div>',
                            remarkHtml,
                            boundaryInfoHtml,
                        '</div>',
                        '<button class="delete-btn" onclick="deleteTrip(\'' +
                             trip._id + '\', \''  +
                            trip._rev + '\')">&times;</button>'
                    ].join('');

                    //tripListEle.appendChild(li);

                    // Show row on timeline layout if it contributes nights or if looking at complete history logs
                    if (chosenTaxYear === "ALL" || 
                        calculatedNightsDisplay > 0 ||  
                        (new Date(trip.departure + "T00:00:00") >= 
                            new Date(parseInt(chosenTaxYear), 3, 6) && 
                        new Date(trip.arrival + "T00:00:00") <= 
                            new Date(parseInt(chosenTaxYear) + 1, 3, 5))) {
                        tripListEle.appendChild(li);
                    }
                });

                totalNightsEle.textContent = totalNights;
                updateVisaVisualBanner(totalNights);
            }).catch(function (err) {
                console.error("Error reading database array:", err);
            });
        }



        window.deleteTrip = function(id, rev) {
            if (confirm("Delete this log?")) {
                db.remove(id, rev).then(function () {
                    fetchAndRenderTrips();
                });
            }
        };

        function formatDate(dateString) {
            const options = { year: 'numeric', month: 'short', day: 'numeric' };
            return new Date(dateString).toLocaleDateString('en-GB', options);
        }

        // Render initial local footprint
        fetchAndRenderTrips();
    </script>
