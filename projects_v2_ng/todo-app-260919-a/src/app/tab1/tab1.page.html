<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Tab 1 Title
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Tab 1</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-item>
    <ion-label>Todo text:</ion-label>
    <ion-input #myinput></ion-input>
    <ion-button (click)="onAddTodo(myinput.value.toString())">Add</ion-button>
  </ion-item> 

  <ion-list>
    <ion-item *ngFor="let item of todos">
      {{ item }}
    </ion-item>
  </ion-list>

  // <app-explore-container name="Tab 1 page"></app-explore-container>

</ion-content>
