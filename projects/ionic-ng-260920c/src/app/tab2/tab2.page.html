<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Tab 2
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Tab 2</ion-title>
    </ion-toolbar>
  </ion-header>

  <app-explore-container name="Tab 2 page"></app-explore-container>

  <ion-input type="text" placeholder="Enter number 1" #firstNumber></ion-input>
  <ion-input type="text" placeholder="Enter number 2" #secondNumber></ion-input>

  <ion-button (click)="onAddTodo(firstNumber.value, secondNumber.value)">Add</ion-button>
  
</ion-content>
